# Local development against sibling repo checkouts, instead of building
# from each repo's GitHub "develop" branch as develop.yml does. Requires
# ../caracal/, ../alt_iip/, ../slideloader/, ../multichannel_tile/ and ../dicomsrv/ to exist as
# sibling directories of this repo.
version: '2'

services:
  mongo:
    image: mongo:8.0
    container_name: ca-mongo
    volumes:
      - ./db:/data/db
  back:
    build: "../caracal/"
    depends_on:
      - "mongo"
    ports:
      - "4010:4010"
      - "9229:9229"
    container_name: ca-back
    command: node --inspect=0.0.0.0:9229 --prof caracal.js
    volumes:
      - ./config/login.html:/src/static/login.html
      - ./jwt_keys/:/src/keys/
      - ./config/routes.json:/src/routes.json
      - ./config/contentSecurityPolicy.json:/src/contentSecurityPolicy.json
      - ../camicroscope/:/src/camicroscope/
    environment:
      JWK_URL: "https://www.googleapis.com/oauth2/v3/certs"
      IIP_PATH: "http://ca-iip:8080/fcgi-bin/iipsrv.fcgi"
      MC_TILE_PATH: "http://ca-mctile:8008/"
      MONGO_URI: "mongodb://ca-mongo"
      DISABLE_SEC: "true"
      ALLOW_PUBLIC: "true"
      NUM_THREADS: 1
  iip:
    build: "../iipimage/"
    container_name: ca-iip
    restart: unless-stopped
    volumes:
      - ./images/:/images/
  mctile:
    build: "../multichannel_tile/"
    container_name: ca-mctile
    restart: unless-stopped
    volumes:
      - ./images/:/images/
  loader:
    build: "../slideloader/"
    container_name: ca-load
    volumes:
      - ./images/:/images/
      - ./cloud-upload-apis/:/cloud-upload-apis/
    environment:
      DICOM_PORT: "11112"
      DICOM_UI_PORT: "8042"
  dicomsrv:
    build: "../dicomsrv/"
    container_name: ca-dicomsrv
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "8042:8042"
      - "11112:11112"
    volumes:
      - ./jwt_keys/:/root/keys/
      - ./images/:/images/
      - ./config/OrthancConfiguration.json:/root/src/Configuration.json
    environment:
      DICOM_PORT: "11112"
      DICOM_UI_PORT: "8042"
      CARACAL_BACK_HOST_PORT: "ca-back:4010"
