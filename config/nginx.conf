events {}

http {
  # Main app: viewer, API, loader, IIP, keycloak-proxy route (all handled internally by ca-back's own router)
  server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/certificate.pem;
    ssl_certificate_key /etc/nginx/certs/privatekey.pem;

    # caracal's /fs/addedFile and /fs/deletedFile have no loginHandler/permissionHandler --
    # they exist only for ca-dicomsrv's orthanc-indexer plugin to notify ca-back over the
    # internal docker network when a DICOM file is stored/removed. That call never goes
    # through this proxy, so block it here rather than leaving it reachable publicly.
    location ~ ^/fs/(addedFile|deletedFile)$ {
      return 403;
    }

    location / {
      proxy_pass http://ca-back:4010;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # Orthanc REST API / Explorer GUI -- kept on a separate port rather than a
  # sub-path, since Orthanc Explorer emits root-relative links.
  server {
    listen 8443 ssl;

    ssl_certificate     /etc/nginx/certs/certificate.pem;
    ssl_certificate_key /etc/nginx/certs/privatekey.pem;

    location / {
      proxy_pass http://ca-dicomsrv:8042;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
