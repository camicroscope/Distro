events {}

http {
  # Main app: viewer, API, loader, IIP (all handled internally by ca-back's own router).
  # No ca-dicomsrv/8443 block here: the osi_camicroscope.yml stack has no dicomsrv
  # service, and nginx would fail to start if this file tried to proxy_pass to a
  # hostname that doesn't exist on the network. See config/nginx.conf for the
  # variant used by stacks that do run dicomsrv.
  server {
    listen 443 ssl;

    ssl_certificate     /etc/nginx/certs/certificate.pem;
    ssl_certificate_key /etc/nginx/certs/privatekey.pem;

    # caracal's /fs/addedFile and /fs/deletedFile have no loginHandler/permissionHandler --
    # they're meant only for a dicomsrv-side notifier to call ca-back over the internal
    # docker network, which never goes through this proxy, so block it here rather than
    # leaving it reachable publicly.
    location ~ ^/fs/(addedFile|deletedFile)$ {
      return 403;
    }

    location / {
      proxy_pass http://ca-back:4010;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
