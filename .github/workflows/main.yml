name: Docker Compose Test
on: push

permissions:
  contents: read

jobs:
  hardening-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./check-hardening.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: test
        run: npm ci
      - name: Audit dependencies
        working-directory: test
        run: npm audit --audit-level=high
      - name: Build the develop stack
        run: |
          n=0
          until [ $n -ge 3 ]; do
            docker compose -f develop.yml build && break
            n=$((n+1))
            echo "Build failed (attempt $n/3) -- dicomsrv's Orthanc fetch over Mercurial is known to be flaky. Retrying in 15s..."
            sleep 15
          done
          if [ $n -ge 3 ]; then
            echo "Build failed after 3 attempts."
            exit 1
          fi
      - name: Start the develop stack
        run: docker compose -f develop.yml up -d
      - name: Wait for the back service to be healthy
        run: timeout 180 bash -c 'until curl -sf http://localhost:4010/apps/viewer/viewer.html > /dev/null; do sleep 3; done'
      - name: Run test suite
        working-directory: test
        run: npm test
      - name: Show container logs on failure
        if: failure()
        run: docker compose -f develop.yml logs
      - name: Tear down
        if: always()
        run: docker compose -f develop.yml down
